# Base44 dev environment: FastAPI backend (uvicorn --reload, CPU) + Vite web UI on port 3000.
# `web` shares the api network namespace so Vite's 127.0.0.1:3900 proxy target works unchanged.
services:
  api:
    image: ghcr.io/astral-sh/uv:python3.12-bookworm
    working_dir: /app
    ports:
      - "3000:3901"
    volumes:
      - .:/app
      - venv:/app/.venv
      - data:/data
      - uvcache:/root/.cache/uv
    environment:
      - OMNIVOICE_SERVER_MODE=1
      - OMNIVOICE_DATA_DIR=/data
      - HF_HOME=/data/huggingface
      - UV_LINK_MODE=copy
      - PYTHONUNBUFFERED=1
    env_file:
      - /run/base44/app.env
    command:
      - sh
      - -ec
      - |
        command -v ffmpeg >/dev/null || (apt-get update && apt-get install -y --no-install-recommends ffmpeg libsndfile1)
        uv sync --frozen
        exec uv run uvicorn main:app --app-dir backend --host 0.0.0.0 --port 3900 --reload --reload-dir backend
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -m 5 http://127.0.0.1:3900/health >/dev/null || (echo backend failed; exit 1)"]
      interval: 15s
      timeout: 6s
      retries: 5
      start_period: 1800s
    restart: on-failure

  web:
    image: oven/bun:1
    working_dir: /app
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - electron_node_modules:/app/electron/node_modules
    environment:
      - OMNIVOICE_PORT=3900
      - VOICESTUDIO_UI_PORT=3901
      - BASE44_DEV_DISABLE_CSP=1
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
    command: ["sh", "-ec", "bun install --frozen-lockfile && cd electron && exec bunx vite --config vite.web.config.ts --host 0.0.0.0"]
    network_mode: "service:api"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bun -e \"const r=await fetch('http://127.0.0.1:3901/');process.exit(r.ok?0:1)\" || (echo frontend failed; exit 1)"]
      interval: 15s
      timeout: 6s
      retries: 5
      start_period: 300s
    restart: on-failure

volumes:
  venv:
  data:
  uvcache:
  node_modules:
  electron_node_modules:
